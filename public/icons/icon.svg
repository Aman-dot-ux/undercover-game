<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3b0764" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="#c4b5fd" stroke-width="8"/>

  <!-- Spy Hat & Glasses Symbol -->
  <g filter="url(#shadow)">
    <!-- Hat Brim -->
    <ellipse cx="256" cy="180" rx="160" ry="24" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5"/>
    
    <!-- Hat Crown -->
    <path d="M 160 180 C 160 110, 200 80, 256 80 C 312 80, 352 110, 352 180 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5"/>
    <path d="M 164 165 C 210 178, 302 178, 348 165 L 350 180 C 300 192, 212 192, 162 180 Z" fill="#854d0e"/>

    <!-- Glasses Frame -->
    <circle cx="176" cy="270" r="68" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6"/>
    <circle cx="336" cy="270" r="68" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6"/>
    <rect x="226" y="258" width="60" height="20" rx="8" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>

    <!-- Dark Sunglasses Lens -->
    <circle cx="176" cy="270" r="48" fill="#1e1b4b"/>
    <circle cx="336" cy="270" r="48" fill="#1e1b4b"/>

    <!-- Lens Glare -->
    <ellipse cx="160" cy="254" rx="18" ry="10" transform="rotate(-30 160 254)" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="320" cy="254" rx="18" ry="10" transform="rotate(-30 320 254)" fill="#ffffff" opacity="0.35"/>

    <!-- Detective Trenchcoat Collar Notch -->
    <path d="M 190 360 L 256 420 L 322 360 L 360 440 L 152 440 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
